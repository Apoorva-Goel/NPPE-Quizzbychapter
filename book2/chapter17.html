<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NPPE Quiz — Chapters 17, 18, 19 (Contract Interpretation, Discharge, Breach)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy-900: #0a1428;
    --navy-800: #0f1d3a;
    --navy-700: #16284f;
    --navy-600: #1d3464;
    --navy-500: #2a4684;
    --gold-300: #f5d98a;
    --gold-400: #e8c46a;
    --gold-500: #d4a84a;
    --gold-600: #b48a36;
    --cream: #f4ead5;
    --white-soft: #f8f5ec;
    --green-correct: #4ea672;
    --red-wrong: #d35a5a;
    --text-light: #e8ddc3;
    --text-muted: #b8a98a;
    --shadow-deep: 0 14px 40px rgba(0,0,0,0.45);
    --radius-md: 12px;
    --radius-lg: 18px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(ellipse at top, var(--navy-700) 0%, var(--navy-900) 75%) fixed;
    color: var(--text-light);
    min-height: 100vh;
    line-height: 1.55;
    overflow-x: hidden;
  }

  /* Fireworks canvas overlay */
  #celebrate-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
  }

  /* Floating popup score messages */
  #popup-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10000;
  }
  .popup {
    position: absolute;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    color: var(--gold-300);
    text-shadow: 0 0 14px rgba(245, 217, 138, 0.8), 0 2px 6px rgba(0,0,0,0.6);
    font-size: 38px;
    animation: float-up 1.6s ease-out forwards;
    white-space: nowrap;
  }
  @keyframes float-up {
    0% { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
    20% { transform: translate(-50%, -10px) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -120px) scale(1.2); opacity: 0; }
  }

  /* Streak badge */
  .streak-flame {
    position: absolute;
    font-size: 48px;
    animation: flame-burst 1.4s ease-out forwards;
    pointer-events: none;
  }
  @keyframes flame-burst {
    0% { transform: translate(-50%, 0) scale(0.5) rotate(-10deg); opacity: 0; }
    25% { transform: translate(-50%, -30px) scale(1.3) rotate(5deg); opacity: 1; }
    100% { transform: translate(-50%, -150px) scale(0.9) rotate(-5deg); opacity: 0; }
  }

  .container {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 24px 0 18px;
    border-bottom: 1px solid rgba(212, 168, 74, 0.25);
    margin-bottom: 28px;
  }
  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px;
    font-weight: 700;
    color: var(--gold-300);
    margin: 0 0 6px;
    letter-spacing: 0.3px;
  }
  .header .subtitle {
    font-size: 13.5px;
    color: var(--text-muted);
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  /* HUD bar */
  .hud {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    background: linear-gradient(135deg, var(--navy-700), var(--navy-800));
    border: 1px solid rgba(212, 168, 74, 0.25);
    border-radius: var(--radius-lg);
    padding: 14px 18px;
    margin-bottom: 22px;
    box-shadow: var(--shadow-deep);
  }
  .hud-item {
    text-align: center;
    min-width: 90px;
  }
  .hud-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .hud-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--gold-300);
  }

  /* Mode buttons */
  .mode-bar {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .mode-btn {
    background: transparent;
    border: 1.5px solid rgba(212, 168, 74, 0.55);
    color: var(--text-light);
    padding: 9px 18px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    transition: all 0.2s ease;
  }
  .mode-btn:hover {
    background: rgba(212, 168, 74, 0.12);
  }
  .mode-btn.active {
    background: var(--gold-500);
    color: var(--navy-900);
    border-color: var(--gold-500);
    box-shadow: 0 0 18px rgba(212, 168, 74, 0.45);
  }

  /* Action buttons */
  .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .action-btn {
    background: rgba(212, 168, 74, 0.08);
    border: 1px solid rgba(212, 168, 74, 0.4);
    color: var(--gold-300);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.5px;
    transition: all 0.2s ease;
  }
  .action-btn:hover {
    background: rgba(212, 168, 74, 0.18);
    transform: translateY(-1px);
  }
  .action-btn.danger {
    border-color: rgba(211, 90, 90, 0.55);
    color: #ecaaaa;
  }
  .action-btn.danger:hover {
    background: rgba(211, 90, 90, 0.12);
  }

  /* Question navigator grid */
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    background: var(--navy-800);
    padding: 12px;
    border-radius: var(--radius-md);
    margin-bottom: 22px;
    border: 1px solid rgba(212, 168, 74, 0.18);
  }
  .nav-cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--navy-600);
    color: var(--text-muted);
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    border: 1.5px solid transparent;
    transition: all 0.15s ease;
  }
  .nav-cell:hover {
    transform: scale(1.08);
    border-color: var(--gold-400);
  }
  .nav-cell.current {
    border-color: var(--gold-300);
    background: var(--navy-500);
    color: var(--gold-300);
  }
  .nav-cell.answered {
    background: rgba(78, 166, 114, 0.35);
    color: var(--cream);
  }
  .nav-cell.correct-pm {
    background: var(--green-correct);
    color: white;
  }
  .nav-cell.wrong-pm {
    background: var(--red-wrong);
    color: white;
  }

  /* Question card */
  .card {
    background: linear-gradient(160deg, var(--navy-800), var(--navy-700));
    border: 1px solid rgba(212, 168, 74, 0.22);
    border-radius: var(--radius-lg);
    padding: 30px 30px 26px;
    box-shadow: var(--shadow-deep);
    margin-bottom: 22px;
  }
  .qnum {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.6px;
    color: var(--gold-400);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .qtext {
    font-family: 'Cormorant Garamond', serif;
    font-size: 21px;
    font-weight: 600;
    color: var(--white-soft);
    margin-bottom: 22px;
    line-height: 1.45;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    background: var(--navy-600);
    border: 1.5px solid rgba(212, 168, 74, 0.2);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.18s ease;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    color: var(--text-light);
    font-size: 14.5px;
  }
  .option:hover:not(.disabled) {
    border-color: var(--gold-400);
    background: var(--navy-500);
    transform: translateX(3px);
  }
  .option.selected {
    border-color: var(--gold-300);
    background: var(--navy-500);
    box-shadow: 0 0 0 2px rgba(245, 217, 138, 0.18);
  }
  .option.correct {
    border-color: var(--green-correct);
    background: rgba(78, 166, 114, 0.18);
  }
  .option.wrong {
    border-color: var(--red-wrong);
    background: rgba(211, 90, 90, 0.18);
  }
  .option.disabled {
    cursor: default;
  }
  .opt-letter {
    background: var(--gold-500);
    color: var(--navy-900);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    flex-shrink: 0;
  }
  .option.correct .opt-letter {
    background: var(--green-correct);
    color: white;
  }
  .option.wrong .opt-letter {
    background: var(--red-wrong);
    color: white;
  }
  .opt-text { flex: 1; padding-top: 3px; }

  /* Rationale */
  .rationale {
    margin-top: 18px;
    padding: 16px 18px;
    background: rgba(212, 168, 74, 0.07);
    border-left: 3px solid var(--gold-500);
    border-radius: 6px;
    font-size: 13.5px;
    color: var(--cream);
    line-height: 1.6;
    display: none;
  }
  .rationale.show { display: block; }
  .rationale-label {
    font-family: 'Cormorant Garamond', serif;
    color: var(--gold-300);
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  /* Nav buttons */
  .nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    gap: 10px;
  }
  .nav-btn {
    background: var(--gold-500);
    color: var(--navy-900);
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.2s ease;
  }
  .nav-btn:hover:not(:disabled) {
    background: var(--gold-300);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(212, 168, 74, 0.35);
  }
  .nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .nav-btn.secondary {
    background: transparent;
    color: var(--gold-300);
    border: 1.5px solid var(--gold-500);
  }
  .nav-btn.secondary:hover:not(:disabled) {
    background: rgba(212, 168, 74, 0.12);
  }

  /* Progress bar */
  .progress {
    height: 6px;
    background: var(--navy-800);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-500), var(--gold-300));
    width: 0%;
    transition: width 0.4s ease;
  }

  /* Results */
  .results {
    text-align: center;
    background: linear-gradient(160deg, var(--navy-800), var(--navy-700));
    border: 1.5px solid var(--gold-500);
    border-radius: var(--radius-lg);
    padding: 44px 32px;
    box-shadow: var(--shadow-deep);
  }
  .results h2 {
    font-family: 'Cormorant Garamond', serif;
    color: var(--gold-300);
    font-size: 38px;
    margin: 0 0 10px;
  }
  .results .score-big {
    font-family: 'Cormorant Garamond', serif;
    font-size: 78px;
    font-weight: 700;
    color: var(--gold-300);
    margin: 16px 0;
    text-shadow: 0 0 30px rgba(245, 217, 138, 0.4);
  }
  .results .verdict {
    font-size: 18px;
    margin: 8px 0 22px;
    color: var(--cream);
  }
  .results .verdict.pass { color: #aef0c5; }
  .results .verdict.fail { color: #ffb6b6; }
  .results .breakdown {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin: 22px 0;
    flex-wrap: wrap;
  }
  .results .breakdown div {
    text-align: center;
  }
  .results .breakdown .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--gold-300);
  }
  .results .breakdown .lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-muted);
  }

  /* Modal */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 20, 40, 0.78);
    z-index: 11000;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--navy-800);
    border: 1px solid var(--gold-500);
    border-radius: var(--radius-lg);
    padding: 30px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: var(--shadow-deep);
  }
  .modal h3 {
    font-family: 'Cormorant Garamond', serif;
    color: var(--gold-300);
    margin: 0 0 12px;
    font-size: 26px;
  }
  .modal p {
    color: var(--cream);
    font-size: 14px;
    margin: 0 0 22px;
  }
  .modal-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  @media (max-width: 640px) {
    .header h1 { font-size: 30px; }
    .qtext { font-size: 18px; }
    .results .score-big { font-size: 62px; }
    .nav-grid { grid-template-columns: repeat(5, 1fr); }
    .container { padding: 20px 14px 60px; }
    .card { padding: 22px 18px; }
  }
</style>

<script>
/* ===========================
   QUESTION BANK (50 items)
   =========================== */
const QUESTIONS = [
  // ===== Chapter 17: Contract Interpretation (Q1–15) =====
  {
    q: "A dispute arises between an engineering firm and its client regarding the meaning of a clause in their consulting agreement. The court is asked to interpret the clause. Which approach to contract interpretation focuses primarily on the precise wording of the agreement and, in the extreme, relies on dictionary meanings?",
    options: [
      "The liberal approach",
      "The strict approach",
      "The reasonableness approach",
      "The intent-only approach"
    ],
    answer: 1,
    rationale: "The strict construction approach focuses on the precise words in the agreement and, in the extreme, relies on dictionary definitions. The liberal approach, by contrast, takes into account the intent of the parties and, in the extreme, may lead to too much speculation about that intent."
  },
  {
    q: "In Hunter Engineering Company v Syncrude Canada Ltd, what approach to contract interpretation did the majority of the Supreme Court of Canada endorse (where the contract is not unconscionable)?",
    options: [
      "Liberal construction emphasising party intent",
      "Strict construction of contract wording",
      "Mandatory arbitration of all disputes",
      "Reliance solely on extrinsic evidence"
    ],
    answer: 1,
    rationale: "In its 1989 decision, the Supreme Court majority endorsed strict construction of contract wording, provided the contract is not unconscionable. Two justices favoured an alternative 'fair and reasonable in all the circumstances' test, but they were in the minority."
  },
  {
    q: "Two engineering parties dispute an ambiguously drafted indemnity clause. The clause was drafted by the larger party and presented to the smaller party on a take-it-or-leave-it basis. Which rule of interpretation is the smaller party most likely to invoke?",
    options: [
      "The parol evidence rule",
      "The doctrine of frustration",
      "The rule of contra proferentem",
      "The doctrine of substantial compliance"
    ],
    answer: 2,
    rationale: "Contra proferentem provides that where a contract is ambiguous, it will be construed against the party that drafted the provision. It is a convenient basis on which to attack a poorly drafted, ambiguous document."
  },
  {
    q: "What does the rule of contra proferentem state?",
    options: [
      "Ambiguous contract terms are construed against the party who drafted them",
      "Verbal agreements always override written agreements",
      "Implied terms always override express terms",
      "The party with greater bargaining power bears the burden of proof in all disputes"
    ],
    answer: 0,
    rationale: "The rule provides that ambiguous wording is interpreted against the drafter. The lesson for engineers and drafters is that clarity matters: ambiguity creates risk for the party who wrote the clause."
  },
  {
    q: "An engineering firm verbally agrees with a contractor that a particular payment milestone will not apply if steel prices rise sharply. The final written contract makes no mention of this. The contractor later attempts to lead evidence of the verbal arrangement. Which rule most likely prevents that evidence?",
    options: [
      "The rule of contra proferentem",
      "The parol evidence rule",
      "The doctrine of frustration",
      "The rule of substantial compliance"
    ],
    answer: 1,
    rationale: "The parol evidence rule generally precludes extrinsic evidence of terms agreed verbally before signing that were not included in the final written contract. The practical takeaway is to ensure all agreed terms are captured in the written contract."
  },
  {
    q: "Which case involved a contract for shared ownership of an invention, in which the parties had verbally agreed the purchase would be conditional on approval by two engineers, even though that condition was not written into the contract?",
    options: [
      "The Moorcock",
      "Pym v Campbell",
      "Hadley v Baxendale",
      "Hunter Engineering v Syncrude Canada"
    ],
    answer: 1,
    rationale: "In Pym v Campbell, the court admitted extrinsic evidence of a condition precedent — the requirement of two engineers' approval. The case illustrates an exception to the parol evidence rule: where it can be substantiated that the written document was never intended to operate as a binding contract unless a condition was first satisfied."
  },
  {
    q: "After a contract has been signed, can the parties alter its terms?",
    options: [
      "No — contracts are immutable after signing",
      "Only with a court order",
      "Yes, provided both parties agree and the essential contract elements are present in the amendment",
      "Only if the contract contains an express force majeure provision"
    ],
    answer: 2,
    rationale: "The parol evidence rule relates to extrinsic evidence prior to execution. After execution, parties remain free to alter the contract by mutual agreement, provided the essential contract elements (offer, acceptance, consideration, intention, capacity, lawful purpose) are present in the amendment."
  },
  {
    q: "A steamship was damaged when, at low tide, it settled on a hard ridge of ground at a jetty where it had been moored under a paid mooring arrangement. There was no express term about safe mooring at low tide. The court implied a term to give business efficacy to the arrangement. Which case is this?",
    options: [
      "Davis Contractors v Fareham",
      "The Moorcock",
      "Pym v Campbell",
      "Alkok v Grymek"
    ],
    answer: 1,
    rationale: "The Moorcock (1889) is the leading authority for the implication of terms to give business efficacy to a contract. The court reasoned that the parties must have intended the vessel would be safe at low tide and implied a term accordingly."
  },
  {
    q: "In Markland Associates Ltd v Lohnes, the Nova Scotia Supreme Court held that, absent express terms, certain implied terms applied to a building contract. Which of the following was NOT identified as an implied term in that decision?",
    options: [
      "Materials and workmanship would be of a proper standard or quality",
      "The work would be carried out in a proper and workmanlike manner",
      "The completed work and materials would be fit for the purposes intended",
      "The contractor would automatically receive a ten percent premium for unforeseen complications"
    ],
    answer: 3,
    rationale: "The implied terms identified in Markland addressed quality, workmanship, fitness for purpose, and completion within a reasonable time without undue delay. Automatic premiums for unforeseen complications are not part of that list and would generally require an express clause."
  },
  {
    q: "In G Ford Homes Ltd v Draft Masonry (York) Co Ltd, the Ontario Court of Appeal implied a term that staircases would comply with the Ontario Building Code. The court applied the principle from which earlier landmark decision?",
    options: [
      "The Moorcock",
      "Hadley v Baxendale",
      "Pym v Campbell",
      "Hunter Engineering v Syncrude Canada"
    ],
    answer: 0,
    rationale: "The Court of Appeal applied the business-efficacy principle from The Moorcock. Because the subcontractor was an expert in stair manufacture and installation and was aware of code requirements, it was natural and reasonable to imply a term requiring code-compliant work."
  },
  {
    q: "Per the Pigott Construction Co v W J Crowe case, when will a court imply a stipulation into a written contract?",
    options: [
      "Whenever one party requests it",

function fisherYates(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function initOrder(shuffle = false) {
  const indices = QUESTIONS.map((_, i) => i);
  state.order = shuffle ? fisherYates(indices) : indices;
}

const particles = [];
function spawnFireworks(x, y, kind = 'gold') {
  const colors = kind === 'gold'
    ? ['#f5d98a','#e8c46a','#d4a84a','#fff5d0','#ffd95b']
    : ['#9be2bb','#ffd95b','#f5d98a','#aedcff'];
  const count = 70 + Math.floor(Math.random()*30);
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random()*0.3;
    const speed = 3 + Math.random()*4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.012 + Math.random()*0.012,
      size: 2 + Math.random()*3,
      color: colors[Math.floor(Math.random()*colors.length)]
    });
  }
}
function spawnStars(x, y) {
  for (let i = 0; i < 14; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random()*3;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed - 2,
      life: 1,
      decay: 0.014,
      size: 6 + Math.random()*6,
      color: '#f5d98a',
      star: true
    });
  }
}
function drawStar(ctx, x, y, r, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.shadowBlur = 14;
  ctx.shadowColor = color;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    ctx.lineTo(0, -r);
    ctx.rotate(Math.PI / 5);
    ctx.lineTo(0, -(r/2.2));
    ctx.rotate(Math.PI / 5);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.life -= p.decay;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    ctx.globalAlpha = Math.max(0, p.life);
    if (p.star) {
      drawStar(ctx, p.x, p.y, p.size, p.color);
    } else {
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  requestAnimationFrame(animate);
}
animate();

function showPopup(text, x, y, color = 'gold') {
  const layer = document.getElementById('popup-layer');
  const el = document.createElement('div');
  el.className = 'popup';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.textContent = text;
  if (color === 'red') el.style.color = '#ecaaaa';
  layer.appendChild(el);
  setTimeout(() => el.remove(), 1700);
}

function showStreakBadge(streak, x, y) {
  const layer = document.getElementById('popup-layer');
  const el = document.createElement('div');
  el.className = 'streak-flame';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  let icon = '🔥';
  if (streak >= 10) icon = '⭐🔥⭐';
  else if (streak >= 5) icon = '🔥🔥';
  el.textContent = icon + ' ' + streak + '!';
  layer.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

/* ===========================
   RENDER
   =========================== */
function updateHud() {
  document.getElementById('hud-score').textContent = state.score;
  document.getElementById('hud-streak').textContent = state.streak;
  document.getElementById('hud-best').textContent = getBest();
  const answered = Object.keys(state.answers).length;
  document.getElementById('hud-answered').textContent = answered + ' / ' + QUESTIONS.length;
  let correctCount = 0;
  Object.keys(state.answers).forEach(k => {
    if (state.answers[k] === QUESTIONS[k].answer) correctCount++;
  });
  document.getElementById('hud-accuracy').textContent =
    answered === 0 ? '—' : Math.round((correctCount/answered)*100) + '%';
  document.getElementById('progress-fill').style.width =
    ((state.current+1)/QUESTIONS.length*100) + '%';
}

function renderNavGrid() {
  const grid = document.getElementById('nav-grid');
  grid.innerHTML = '';
  for (let i = 0; i < state.order.length; i++) {
    const realIdx = state.order[i];
    const cell = document.createElement('div');
    cell.className = 'nav-cell';
    cell.textContent = i + 1;
    if (i === state.current) cell.classList.add('current');
    if (state.answers[realIdx] !== undefined) {
      if (state.mode === 'practice' || state.examSubmitted) {
        if (state.answers[realIdx] === QUESTIONS[realIdx].answer) {
          cell.classList.add('correct-pm');
        } else {
          cell.classList.add('wrong-pm');
        }
      } else {
        cell.classList.add('answered');
      }
    }
    cell.addEventListener('click', () => {
      state.current = i;
      saveState();
      renderQuestion();
      renderNavGrid();
      updateHud();
    });
    grid.appendChild(cell);
  }
}

function renderQuestion() {
  const area = document.getElementById('quiz-area');

  // If exam submitted, show results
  if (state.mode === 'exam' && state.examSubmitted) {
    renderResults();
    return;
  }

  const idx = state.order[state.current];
  const q = QUESTIONS[idx];
  const answered = state.answers[idx];
  const showRationale = state.mode === 'practice' && state.shown[idx];

  area.innerHTML = `
    <div class="card" id="qcard">
      <div class="qnum">Question ${state.current + 1} of ${QUESTIONS.length}</div>
      <div class="qtext">${q.q}</div>
      <div class="options" id="opts"></div>
      ${showRationale ? `
        <div class="rationale show">
          <div class="rationale-label">${answered === q.answer ? '✓ Correct.' : '✗ Not quite.'} Why:</div>
          ${q.rationale}
        </div>
      ` : ''}
      <div class="nav-bar">
        <button class="nav-btn secondary" id="btn-prev" ${state.current === 0 ? 'disabled' : ''}>◀ Previous</button>
        <button class="nav-btn" id="btn-next" ${state.current === QUESTIONS.length-1 ? 'disabled' : ''}>Next ▶</button>
      </div>
    </div>
  `;

  const opts = document.getElementById('opts');
  const letters = ['A','B','C','D'];
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<div class="opt-letter">${letters[i]}</div><div class="opt-text">${opt}</div>`;

    if (answered !== undefined) {
      div.classList.add('disabled');
      if (state.mode === 'practice' || state.examSubmitted) {
        if (i === q.answer) div.classList.add('correct');
        if (i === answered && answered !== q.answer) div.classList.add('wrong');
      } else {
        if (i === answered) div.classList.add('selected');
      }
    }

    div.addEventListener('click', (ev) => {
      handleAnswer(idx, i, ev);
    });
    opts.appendChild(div);
  });

  document.getElementById('btn-prev').addEventListener('click', () => {
    if (state.current > 0) {
      state.current--;
      saveState();
      renderQuestion();
      renderNavGrid();
      updateHud();
    }
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    if (state.current < QUESTIONS.length - 1) {
      state.current++;
      saveState();
      renderQuestion();
      renderNavGrid();
      updateHud();
    }
  });
}

function handleAnswer(qIdx, choice, ev) {
  const q = QUESTIONS[qIdx];

  if (state.mode === 'practice') {
    // Allow re-answer in practice mode only if not yet answered
    if (state.answers[qIdx] !== undefined) return;
    state.answers[qIdx] = choice;
    state.shown[qIdx] = true;
    const correct = choice === q.answer;
    const rect = ev.currentTarget.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    if (correct) {
      state.streak++;
      let pts = 10;
      let bonusText = '';
      if (state.streak >= 3) {
        pts += 5;
        bonusText = ' +Streak';
      }
      if (state.streak >= 5) {
        pts += 5;
      }
      state.score += pts;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      // Update best
      if (state.score > getBest()) setBest(state.score);
      spawnFireworks(cx, cy, 'gold');
      spawnStars(cx, cy);
      showPopup('+' + pts + bonusText, cx, cy - 20, 'gold');
      if (state.streak >= 3) {
        showStreakBadge(state.streak, cx, cy);
      }
    } else {
      state.streak = 0;
      showPopup('—', cx, cy - 20, 'red');
    }
  } else {
    // Exam mode: allow change until submission
    if (state.examSubmitted) return;
    state.answers[qIdx] = choice;
  }
  saveState();
  renderQuestion();
  renderNavGrid();
  updateHud();
}

/* ===========================
   RESULTS
   =========================== */
function renderResults() {
  const area = document.getElementById('quiz-area');
  let correct = 0;
  QUESTIONS.forEach((q, i) => {
    if (state.answers[i] === q.answer) correct++;
  });
  const pct = Math.round((correct/QUESTIONS.length)*100);
  const passed = pct >= 65;
  let verdict, verdictClass, headline;
  if (pct >= 90) {
    headline = 'Exceptional';
    verdict = 'Outstanding work — well above the NPPE pass threshold. You have mastered this material.';
    verdictClass = 'pass';
  } else if (pct >= 80) {
    headline = 'Strong Pass';
    verdict = 'Strong performance, comfortably above the NPPE pass threshold.';
    verdictClass = 'pass';
  } else if (pct >= 65) {
    headline = 'Pass';
    verdict = 'You met the NPPE pass threshold of 65%. Review the questions you missed to reinforce.';
    verdictClass = 'pass';
  } else if (pct >= 50) {
    headline = 'Close';
    verdict = 'Below the 65% NPPE pass threshold. Review the rationales and try again.';
    verdictClass = 'fail';
  } else {
    headline = 'Keep Studying';
    verdict = 'Well below the NPPE pass threshold. Revisit the chapter content and try again.';
    verdictClass = 'fail';
  }

  area.innerHTML = `
    <div class="results">
      <h2>${headline}</h2>
      <div class="score-big">${pct}%</div>
      <div class="verdict ${verdictClass}">${verdict}</div>
      <div class="breakdown">
        <div><div class="num">${correct}</div><div class="lbl">Correct</div></div>
        <div><div class="num">${QUESTIONS.length - correct}</div><div class="lbl">Incorrect</div></div>
        <div><div class="num">${state.bestStreak}</div><div class="lbl">Best Streak</div></div>
      </div>
      <div style="margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button class="nav-btn secondary" id="btn-review">Review Answers</button>
        <button class="nav-btn" id="btn-reset-results">Try Again</button>
      </div>
    </div>
  `;

  // Big celebration if passed
  if (passed) {
    setTimeout(() => {
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          const x = Math.random() * window.innerWidth;
          const y = 100 + Math.random() * (window.innerHeight/2);
          spawnFireworks(x, y, i % 2 === 0 ? 'gold' : 'mix');
        }, i * 250);
      }
    }, 200);
  }

  document.getElementById('btn-review').addEventListener('click', () => {
    state.examSubmitted = false;
    state.mode = 'practice';
    // Reveal rationales for all answered
    Object.keys(state.answers).forEach(k => state.shown[k] = true);
    document.getElementById('btn-practice').classList.add('active');
    document.getElementById('btn-exam').classList.remove('active');
    document.getElementById('btn-submit-exam').style.display = 'none';
    state.current = 0;
    saveState();
    renderQuestion();
    renderNavGrid();
    updateHud();
  });
  document.getElementById('btn-reset-results').addEventListener('click', () => {
    doReset();
  });
}

/* ===========================
   CONTROLS
   =========================== */
document.getElementById('btn-practice').addEventListener('click', () => {
  state.mode = 'practice';
  state.examSubmitted = false;
  document.getElementById('btn-practice').classList.add('active');
  document.getElementById('btn-exam').classList.remove('active');
  document.getElementById('btn-submit-exam').style.display = 'none';
  saveState();
  renderQuestion();
  renderNavGrid();
});

document.getElementById('btn-exam').addEventListener('click', () => {
  state.mode = 'exam';
  state.examSubmitted = false;
  // Clear practice-shown rationales for clean exam UI
  state.shown = {};
  document.getElementById('btn-exam').classList.add('active');
  document.getElementById('btn-practice').classList.remove('active');
  document.getElementById('btn-submit-exam').style.display = 'inline-block';
  saveState();
  renderQuestion();
  renderNavGrid();
});

document.getElementById('btn-submit-exam').addEventListener('click', () => {
  const answered = Object.keys(state.answers).length;
  if (answered < QUESTIONS.length) {
    if (!confirm('You have only answered ' + answered + ' of ' + QUESTIONS.length + ' questions. Submit anyway?')) {
      return;
    }
  }
  state.examSubmitted = true;
  // Compute final score (no per-answer celebrations in exam, but apply scoring now)
  let correct = 0;
  state.streak = 0;
  state.bestStreak = 0;
  let runStreak = 0;
  state.order.forEach((realIdx) => {
    if (state.answers[realIdx] === QUESTIONS[realIdx].answer) {
      correct++;
      runStreak++;
      if (runStreak > state.bestStreak) state.bestStreak = runStreak;
    } else {
      runStreak = 0;
    }
  });
  state.score = correct * 10 + state.bestStreak * 5;
  if (state.score > getBest()) setBest(state.score);
  saveState();
  renderResults();
  renderNavGrid();
  updateHud();
});

document.getElementById('btn-shuffle').addEventListener('click', () => {
  if (!confirm('Shuffle question order? Your current answers will be kept against their original questions.')) return;
  initOrder(true);
  state.current = 0;
  saveState();
  renderQuestion();
  renderNavGrid();
  updateHud();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  document.getElementById('reset-modal').classList.add('show');
});
document.getElementById('reset-cancel').addEventListener('click', () => {
  document.getElementById('reset-modal').classList.remove('show');
});
document.getElementById('reset-confirm').addEventListener('click', () => {
  document.getElementById('reset-modal').classList.remove('show');
  doReset();
});

function doReset() {
  state = {
    order: [],
    current: 0,
    answers: {},
    score: 0,
    streak: 0,
    bestStreak: 0,
    mode: 'practice',
    examSubmitted: false,
    shown: {}
  };
  initOrder(false);
  try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
  document.getElementById('btn-practice').classList.add('active');
  document.getElementById('btn-exam').classList.remove('active');
  document.getElementById('btn-submit-exam').style.display = 'none';
  renderQuestion();
  renderNavGrid();
  updateHud();
}

/* ===========================
   INIT
   =========================== */
if (!loadState()) {
  initOrder(false);
}
// Sync UI mode buttons with state
if (state.mode === 'exam') {
  document.getElementById('btn-exam').classList.add('active');
  document.getElementById('btn-practice').classList.remove('active');
  document.getElementById('btn-submit-exam').style.display = 'inline-block';
}
renderQuestion();
renderNavGrid();
updateHud();
</script>
</body>
</html>
