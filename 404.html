<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page not found — NPPE Practice Quizzes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;700&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#faf9f6;--text:#1a1a2e;--accent:#8b2232;--muted:#6b6879;--card:#fff;--border:#e0ddd6}
  @media(prefers-color-scheme:dark){:root{--bg:#0f0f14;--text:#e8e6e1;--accent:#d4626f;--muted:#9a97a8;--card:#1a1a22;--border:#2e2e38}}
  body{font-family:'Source Serif 4',Georgia,serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.5}
  .box{max-width:520px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:48px 32px}
  .num{font-size:88px;font-weight:700;color:var(--accent);line-height:1;letter-spacing:-3px;font-family:'Source Serif 4',serif;font-style:italic}
  h1{font-size:24px;font-weight:700;margin:16px 0 10px;letter-spacing:-.3px}
  p{color:var(--muted);font-family:'DM Sans',sans-serif;font-size:15px;margin-bottom:24px}
  a{display:inline-block;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;padding:12px 28px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;transition:opacity .15s}
  a:hover{opacity:.9}
</style>
</head>
<body>
  <div class="box">
    <div class="num">404</div>
    <h1>That quiz isn't here</h1>
    <p>The chapter you're looking for either hasn't been added yet, or the URL has a typo. Head back to the hub to see what's available.</p>
    <a href="/">← Back to the study hub</a>
  </div>
</body>
</html>
