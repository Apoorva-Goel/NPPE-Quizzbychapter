<html lang="en">
<head>

<title>NPPE Practice Exam — Chapter 8: Diversity in the Professional Workplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1419;
    --bg-soft: #161c24;
    --card: #1c2330;
    --card-hover: #232b3a;
    --border: #2a3343;
    --text: #e8eef5;
    --text-dim: #9aa7ba;
    --text-faint: #6b7689;
    --accent: #6366f1;
    --accent-light: #818cf8;
    --accent-glow: rgba(99, 102, 241, 0.25);
    --success: #10b981;
    --success-glow: rgba(16, 185, 129, 0.3);
    --error: #ef4444;
    --error-glow: rgba(239, 68, 68, 0.25);
    --gold: #fbbf24;
    --gold-light: #fcd34d;
    --gold-glow: rgba(251, 191, 36, 0.4);
    --shadow-lg: 0 20px 60px rgba(0,0,0,0.4);
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(251, 191, 36, 0.05), transparent 45%);
    color: var(--text);
    line-height: 1.55;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding: 24px 16px 80px;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
  }

  /* HEADER */
  .header {
    margin-bottom: 28px;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .header h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(1.4rem, 4vw, 1.85rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 0%, #c7d2fe 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.2;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 0.92rem;
    margin-top: 4px;
  }

  .stats-row {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .stat-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.3s;
  }
  .stat-pill.score { color: var(--gold); }
  .stat-pill.streak { color: #f97316; }
  .stat-pill .label { color: var(--text-faint); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-pill.flash {
    transform: scale(1.08);
    border-color: var(--gold);
    box-shadow: 0 0 24px var(--gold-glow);
  }

  /* PROGRESS BAR */
  .progress-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
    position: relative;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 100%);
    border-radius: 999px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--text-faint);
  }

  /* QUESTION CARD */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-top: 24px;
    box-shadow: var(--shadow-lg);
    animation: cardIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-num {
    font-size: 0.78rem;
    color: var(--accent-light);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .q-text {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1.18rem;
    font-weight: 600;
    line-height: 1.45;
    margin-bottom: 22px;
    color: var(--text);
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    background: var(--bg-soft);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    text-align: left;
    font-family: inherit;
    font-size: 0.96rem;
    color: var(--text);
    width: 100%;
    line-height: 1.5;
  }
  .option:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--card-hover);
    transform: translateX(2px);
  }
  .option:disabled { cursor: not-allowed; }
  .option-letter {
    background: var(--card-hover);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .option:hover:not(:disabled) .option-letter {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .option.correct {
    background: rgba(16, 185, 129, 0.12);
    border-color: var(--success);
    box-shadow: 0 0 0 1px var(--success), 0 8px 24px var(--success-glow);
  }
  .option.correct .option-letter {
    background: var(--success);
    color: white;
    border-color: var(--success);
  }
  .option.incorrect {
    background: rgba(239, 68, 68, 0.1);
    border-color: var(--error);
  }
  .option.incorrect .option-letter {
    background: var(--error);
    color: white;
    border-color: var(--error);
  }

  /* FEEDBACK */
  .feedback {
    margin-top: 20px;
    padding: 16px 18px;
    border-radius: 10px;
    font-size: 0.94rem;
    line-height: 1.55;
    display: none;
    animation: fadeUp 0.35s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .feedback.show { display: block; }
  .feedback.correct {
    background: rgba(16, 185, 129, 0.08);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: #6ee7b7;
  }
  .feedback.incorrect {
    background: rgba(239, 68, 68, 0.06);
    border: 1px solid rgba(239, 68, 68, 0.25);
    color: #fca5a5;
  }
  .feedback strong { color: white; }
  .feedback-label {
    font-weight: 700;
    font-family: 'Plus Jakarta Sans', sans-serif;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* BUTTONS */
  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    gap: 12px;
  }
  .btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 14px var(--accent-glow);
  }
  .btn:hover { background: var(--accent-light); transform: translateY(-1px); box-shadow: 0 6px 20px var(--accent-glow); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  .btn.ghost:hover { background: var(--card-hover); color: var(--text); border-color: var(--text-faint); }
  .btn.gold {
    background: linear-gradient(135deg, var(--gold) 0%, #f59e0b 100%);
    box-shadow: 0 4px 14px var(--gold-glow);
    color: #1a1a1a;
  }
  .btn.gold:hover { box-shadow: 0 8px 24px var(--gold-glow); }

  /* RESULTS SCREEN */
  .results {
    text-align: center;
    padding: 40px 28px;
  }
  .results-emoji {
    font-size: 5rem;
    margin-bottom: 12px;
    animation: bounce 1s ease;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
  .results h2 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .results-subtitle { color: var(--text-dim); margin-bottom: 32px; }
  .results-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }
  .result-stat {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 12px;
  }
  .result-stat .num {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
  }
  .result-stat .num.success { color: var(--success); }
  .result-stat .num.error { color: var(--error); }
  .result-stat .num.gold { color: var(--gold); }
  .result-stat .lbl {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .results-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* CELEBRATIONS — fixed overlays */
  #celebration-canvas,
  #fireworks-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
  }

  .floating-emoji {
    position: fixed;
    font-size: 3rem;
    pointer-events: none;
    z-index: 10000;
    animation: floatUp 1.4s ease-out forwards;
    user-select: none;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 0) scale(0.4); }
    25% { opacity: 1; transform: translate(-50%, -40px) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -180px) scale(0.9); }
  }

  .points-burst {
    position: fixed;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 2.2rem;
    color: var(--gold);
    text-shadow: 0 0 20px var(--gold-glow), 0 4px 12px rgba(0,0,0,0.6);
    pointer-events: none;
    z-index: 10000;
    animation: pointsBurst 1.3s ease-out forwards;
    user-select: none;
  }
  @keyframes pointsBurst {
    0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
    20% { opacity: 1; transform: translate(-50%, -10px) scale(1.3); }
    100% { opacity: 0; transform: translate(-50%, -120px) scale(1); }
  }

  .streak-banner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
    color: white;
    padding: 18px 36px;
    border-radius: 999px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 1.4rem;
    box-shadow: 0 10px 40px rgba(245, 158, 11, 0.5);
    z-index: 10001;
    pointer-events: none;
    animation: streakPop 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    white-space: nowrap;
  }
  @keyframes streakPop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
    20% { transform: translate(-50%, -50%) scale(1.15) rotate(3deg); opacity: 1; }
    35% { transform: translate(-50%, -50%) scale(1) rotate(0); }
    80% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.85) rotate(0); opacity: 0; }
  }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    body { padding: 16px 12px 60px; }
    .card { padding: 22px 18px; }
    .q-text { font-size: 1.05rem; }
    .results-grid { grid-template-columns: 1fr 1fr 1fr; }
    .stat-pill { padding: 6px 11px; font-size: 0.78rem; }
    .actions { flex-direction: column-reverse; }
    .actions .btn { width: 100%; }
  }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 32px;
    color: var(--text-faint);
    font-size: 0.78rem;
  }
</style>
</head>

<script>
/* ============================================================
   QUESTION BANK — 50 NPPE-style questions for Chapter 8
   ============================================================ */
const QUESTIONS = [
  {
    q: "According to the Canadian Charter of Rights and Freedoms, Section 7, everyone has the right to:",

  {

  {

    answer: 2,

    answer: 0,

      "Contracts always override human rights legislation",

      "Contracts can be rescinded and statutes nullified if found to be discriminatory",

  {

  },
  {

      "Three",

/* ============================================================
   STATE
   ============================================================ */
const STORAGE_KEY = 'nppe_ch8_exam_v1';
let state = loadState();

function freshState() {
  return {
    current: 0,
    score: 0,
    streak: 0,
    bestStreak: 0,
    correctCount: 0,
    answered: [],          // {idx, chosen, correct} per answered question
    finished: false
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object' && Array.isArray(parsed.answered)) return parsed;
    }
  } catch (e) {}
  return freshState();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
function resetAll() {
  state = freshState();
  saveState();
  render();
}

/* ============================================================
   RENDER
   ============================================================ */
const quizArea = document.getElementById('quizArea');
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');
const accuracyText = document.getElementById('accuracyText');
const scoreVal = document.getElementById('scoreVal');
const scorePill = document.getElementById('scorePill');
const streakPill = document.getElementById('streakPill');
const streakVal = document.getElementById('streakVal');

function updateHud() {
  scoreVal.textContent = state.score;
  if (state.streak >= 2) {
    streakPill.style.display = 'flex';
    streakVal.textContent = state.streak;
  } else {
    streakPill.style.display = 'none';
  }

  const total = QUESTIONS.length;
  const done = state.finished ? total : state.current;
  const pct = (done / total) * 100;
  progressBar.style.width = pct + '%';
  progressText.textContent = state.finished
    ? `Completed all ${total} questions`
    : `Question ${state.current + 1} of ${total}`;

  const answeredCount = state.answered.length;
  const acc = answeredCount === 0 ? 0 : Math.round((state.correctCount / answeredCount) * 100);
  accuracyText.textContent = answeredCount === 0 ? '—' : `${acc}% accuracy`;
}

function render() {
  updateHud();
  if (state.finished) return renderResults();
  renderQuestion();
}

function renderQuestion() {
  const idx = state.current;
  const q = QUESTIONS[idx];
  const letters = ['A', 'B', 'C', 'D'];

  quizArea.innerHTML = `
    <div class="card" id="qCard">
      <div class="q-num">Question ${idx + 1} · of ${QUESTIONS.length}</div>
      <div class="q-text">${escapeHtml(q.q)}</div>
      <div class="options" id="optList">
        ${q.options.map((opt, i) => `
          <button class="option" data-i="${i}">
            <span class="option-letter">${letters[i]}</span>
            <span>${escapeHtml(opt)}</span>
          </button>
        `).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn ghost" id="resetBtn">↺ Reset Quiz</button>
        <button class="btn" id="nextBtn" disabled>Next →</button>
      </div>
    </div>
  `;

  document.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(parseInt(btn.dataset.i, 10)));
  });
  document.getElementById('nextBtn').addEventListener('click', goNext);
  document.getElementById('resetBtn').addEventListener('click', confirmReset);
}

function handleAnswer(chosen) {
  const idx = state.current;
  const q = QUESTIONS[idx];
  const isCorrect = chosen === q.answer;
  const buttons = document.querySelectorAll('.option');

  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    else if (i === chosen) btn.classList.add('incorrect');
  });

  // Score logic
  if (isCorrect) {
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    state.correctCount++;
    let pts = 10;
    if (state.streak >= 5) pts = 25;
    else if (state.streak >= 3) pts = 15;
    state.score += pts;
    showFeedback(true, q.explanation);
    celebrate(pts, state.streak);
  } else {
    state.streak = 0;
    showFeedback(false, q.explanation, q.options[q.answer], ['A','B','C','D'][q.answer]);
  }

  state.answered.push({ idx, chosen, correct: isCorrect });
  document.getElementById('nextBtn').disabled = false;
  if (idx === QUESTIONS.length - 1) {
    document.getElementById('nextBtn').textContent = 'See Results →';
  }
  updateHud();
  saveState();
}

function showFeedback(correct, explanation, correctText, correctLetter) {
  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (correct ? 'correct' : 'incorrect');
  if (correct) {
    fb.innerHTML = `
      <div class="feedback-label">✓ Correct</div>
      <div>${escapeHtml(explanation)}</div>
    `;
  } else {
    fb.innerHTML = `
      <div class="feedback-label">✗ Not quite</div>
      <div><strong>Correct answer: ${correctLetter}.</strong> ${escapeHtml(correctText)}</div>
      <div style="margin-top:8px">${escapeHtml(explanation)}</div>
    `;
  }
}

function goNext() {
  if (state.current >= QUESTIONS.length - 1) {
    state.finished = true;
  } else {
    state.current++;
  }
  saveState();
  render();
}

function renderResults() {
  const total = QUESTIONS.length;
  const correct = state.correctCount;
  const incorrect = total - correct;
  const pct = Math.round((correct / total) * 100);

  let emoji = '🎯', title = 'Quiz Complete', sub = 'Review the explanations and try again to improve.';
  if (pct === 100) { emoji = '🏆'; title = 'Perfect Score!'; sub = 'Outstanding mastery of Chapter 8. You\'re ready for this section of the NPPE.'; }
  else if (pct >= 90) { emoji = '🌟'; title = 'Exceptional!'; sub = 'You have a strong grasp of the chapter material.'; }
  else if (pct >= 80) { emoji = '🎉'; title = 'Great Work!'; sub = 'Solid performance — review the few you missed and you\'ll be set.'; }
  else if (pct >= 70) { emoji = '👍'; title = 'Good Effort'; sub = 'Above passing — but a focused review will lift you further.'; }
  else if (pct >= 60) { emoji = '📚'; title = 'Keep Studying'; sub = 'You have the foundations — re-read the chapter sections you missed.'; }
  else { emoji = '💪'; title = 'Time for a Re-Read'; sub = 'Don\'t be discouraged. Revisit the chapter and try again.'; }

  quizArea.innerHTML = `
    <div class="card results">
      <div class="results-emoji">${emoji}</div>
      <h2>${title}</h2>
      <div class="results-subtitle">${sub}</div>
      <div class="results-grid">
        <div class="result-stat">
          <div class="num gold">${state.score}</div>
          <div class="lbl">Total Points</div>
        </div>
        <div class="result-stat">
          <div class="num success">${correct}/${total}</div>
          <div class="lbl">Correct (${pct}%)</div>
        </div>
        <div class="result-stat">
          <div class="num">${state.bestStreak}🔥</div>
          <div class="lbl">Best Streak</div>
        </div>
      </div>
      <div class="results-actions">
        <button class="btn gold" id="resetFinal">↺ Reset & Try Again</button>
        <button class="btn ghost" id="reviewBtn">Review Answers</button>
      </div>
      <div id="reviewArea" style="margin-top:24px;text-align:left;display:none"></div>
    </div>
  `;

  document.getElementById('resetFinal').addEventListener('click', resetAll);
  document.getElementById('reviewBtn').addEventListener('click', toggleReview);

  // Big celebration if good score
  if (pct === 100) finalFireworks(8);
  else if (pct >= 80) finalFireworks(4);
  else if (pct >= 60) finalFireworks(2);
}

function toggleReview() {
  const area = document.getElementById('reviewArea');
  const btn = document.getElementById('reviewBtn');
  if (area.style.display === 'none') {
    area.style.display = 'block';
    btn.textContent = 'Hide Review';
    area.innerHTML = state.answered.map((a, n) => {
      const q = QUESTIONS[a.idx];
      const letters = ['A', 'B', 'C', 'D'];
      return `
        <div style="background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:10px">
          <div style="font-size:0.78rem;color:var(--text-faint);font-weight:600;letter-spacing:0.05em;text-transform:uppercase">
            Q${n + 1} ${a.correct ? '· <span style="color:var(--success)">✓ Correct</span>' : '· <span style="color:var(--error)">✗ Incorrect</span>'}
          </div>
          <div style="font-weight:600;margin:6px 0 10px;font-family:'Plus Jakarta Sans',sans-serif">${escapeHtml(q.q)}</div>
          <div style="font-size:0.9rem;color:var(--text-dim)">
            <div>Your answer: <strong style="color:${a.correct ? 'var(--success)' : 'var(--error)'}">${letters[a.chosen]}. ${escapeHtml(q.options[a.chosen])}</strong></div>
            ${a.correct ? '' : `<div style="margin-top:4px">Correct answer: <strong style="color:var(--success)">${letters[q.answer]}. ${escapeHtml(q.options[q.answer])}</strong></div>`}
            <div style="margin-top:8px;color:var(--text-dim);font-style:italic">${escapeHtml(q.explanation)}</div>
          </div>
        </div>
      `;
    }).join('');
  } else {
    area.style.display = 'none';
    btn.textContent = 'Review Answers';
  }
}

function confirmReset() {
  if (confirm('Reset the quiz and clear your progress?')) resetAll();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   CELEBRATIONS — confetti, fireworks, stars, emoji, points, streak
   ============================================================ */
const celebCanvas = document.getElementById('celebration-canvas');
const celebCtx = celebCanvas.getContext('2d');
const fwCanvas = document.getElementById('fireworks-canvas');
const fwCtx = fwCanvas.getContext('2d');

function sizeCanvases() {
  [celebCanvas, fwCanvas].forEach(c => {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  });
}
window.addEventListener('resize', sizeCanvases);
sizeCanvases();

let particles = [];
let fireworks = [];

function celebrate(points, streak) {
  // Flash score pill
  scorePill.classList.add('flash');
  setTimeout(() => scorePill.classList.remove('flash'), 600);

  // +points burst near score pill
  const pillRect = scorePill.getBoundingClientRect();
  spawnPointsBurst(pillRect.left + pillRect.width / 2, pillRect.top + pillRect.height + 4, '+' + points);

  // Pick celebration based on streak
  const r = Math.random();
  if (streak >= 5) {
    // Maximum: golden shower + fireworks + streak banner + emoji
    spawnGoldenShower(80);
    spawnFireworks(3);
    spawnStreakBanner(streak);
    spawnFloatingEmoji('🔥');
  } else if (streak >= 3) {
    // Big: confetti + stars + emoji
    spawnConfetti(60);
    spawnStars(15);
    if (streak === 3) spawnStreakBanner(streak);
    spawnFloatingEmoji(['⭐', '✨', '🌟'][Math.floor(Math.random() * 3)]);
  } else {
    // Standard: confetti or stars + happy face
    if (r < 0.5) spawnConfetti(40);
    else spawnStars(12);
    spawnFloatingEmoji(['😊', '🎉', '👏', '✨'][Math.floor(Math.random() * 4)]);
  }
}

function finalFireworks(count) {
  let n = 0;
  const interval = setInterval(() => {
    spawnFireworks(1);
    n++;
    if (n >= count) clearInterval(interval);
  }, 600);
  if (count >= 6) {
    setTimeout(() => spawnGoldenShower(120), 300);
  }
}

/* ----- Confetti ----- */
function spawnConfetti(n) {
  const colors = ['#6366f1', '#8b5cf6', '#ec4899', '#10b981', '#f59e0b', '#ef4444', '#06b6d4'];
  for (let i = 0; i < n; i++) {
    particles.push({
      type: 'confetti',
      x: window.innerWidth * (0.3 + Math.random() * 0.4),
      y: -20,
      vx: (Math.random() - 0.5) * 8,
      vy: Math.random() * 3 + 2,
      gravity: 0.18,
      size: Math.random() * 8 + 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.25,
      life: 1
    });
  }
  if (!animating) animate();
}

/* ----- Golden Shower (gold particles raining) ----- */
function spawnGoldenShower(n) {
  const golds = ['#fbbf24', '#fcd34d', '#f59e0b', '#fde68a', '#facc15'];
  for (let i = 0; i < n; i++) {
    particles.push({
      type: 'gold',
      x: Math.random() * window.innerWidth,
      y: -30 - Math.random() * 200,
      vx: (Math.random() - 0.5) * 2,
      vy: Math.random() * 4 + 3,
      gravity: 0.12,
      size: Math.random() * 6 + 4,
      color: golds[Math.floor(Math.random() * golds.length)],
      glow: true,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.3,
      life: 1
    });
  }
  if (!animating) animate();
}

/* ----- Stars ----- */
function spawnStars(n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      type: 'star',
      x: window.innerWidth * (0.2 + Math.random() * 0.6),
      y: window.innerHeight * (0.3 + Math.random() * 0.4),
      vx: (Math.random() - 0.5) * 6,
      vy: -Math.random() * 4 - 2,
      gravity: 0.15,
      size: Math.random() * 14 + 10,
      color: ['#fbbf24', '#fcd34d', '#fde68a', '#fff'][Math.floor(Math.random() * 4)],
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.4,
      life: 1
    });
  }
  if (!animating) animate();
}

let animating = false;
function animate() {
  animating = true;
  celebCtx.clearRect(0, 0, celebCanvas.width, celebCanvas.height);

  particles = particles.filter(p => {
    p.vy += p.gravity;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vrot;

    // fade if past bottom
    if (p.y > window.innerHeight + 50) p.life -= 0.1;
    if (p.life <= 0) return false;

    celebCtx.save();
    celebCtx.translate(p.x, p.y);
    celebCtx.rotate(p.rot);
    celebCtx.globalAlpha = Math.max(0, Math.min(1, p.life));

    if (p.glow) {
      celebCtx.shadowColor = p.color;
      celebCtx.shadowBlur = 14;
    }

    celebCtx.fillStyle = p.color;

    if (p.type === 'star') {
      drawStar(celebCtx, 0, 0, 5, p.size, p.size / 2);
    } else if (p.type === 'gold') {
      celebCtx.beginPath();
      celebCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
      celebCtx.fill();
    } else {
      // confetti rectangle
      celebCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    }
    celebCtx.restore();

    return true;
  });

  if (particles.length > 0 || fireworks.length > 0) {
    requestAnimationFrame(animate);
  } else {
    animating = false;
    celebCtx.clearRect(0, 0, celebCanvas.width, celebCanvas.height);
  }
}

function drawStar(ctx, cx, cy, spikes, outer, inner) {
  let rot = Math.PI / 2 * 3;
  let x = cx, y = cy;
  const step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outer);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outer;
    y = cy + Math.sin(rot) * outer;
    ctx.lineTo(x, y);
    rot += step;
    x = cx + Math.cos(rot) * inner;
    y = cy + Math.sin(rot) * inner;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outer);
  ctx.closePath();
  ctx.fill();
}

/* ----- Fireworks ----- */
function spawnFireworks(count) {
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      launchFirework();
    }, i * 250);
  }
  if (!fwAnimating) fwAnimate();
}

function launchFirework() {
  const x = window.innerWidth * (0.15 + Math.random() * 0.7);
  const y = window.innerHeight * (0.2 + Math.random() * 0.3);
  const colors = ['#fbbf24', '#ef4444', '#10b981', '#6366f1', '#ec4899', '#06b6d4', '#f59e0b'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  const count = 50 + Math.floor(Math.random() * 30);
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
    const speed = Math.random() * 5 + 3;
    fireworks.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      color,
      life: 1,
      decay: Math.random() * 0.015 + 0.012,
      size: Math.random() * 2 + 1.5
    });
  }
}

let fwAnimating = false;
function fwAnimate() {
  fwAnimating = true;
  // Trail effect
  fwCtx.fillStyle = 'rgba(15, 20, 25, 0.18)';
  fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);

  fireworks = fireworks.filter(p => {
    p.vx *= 0.985;
    p.vy *= 0.985;
    p.vy += 0.06;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) return false;

    fwCtx.save();
    fwCtx.globalAlpha = p.life;
    fwCtx.fillStyle = p.color;
    fwCtx.shadowColor = p.color;
    fwCtx.shadowBlur = 12;
    fwCtx.beginPath();
    fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    fwCtx.fill();
    fwCtx.restore();

    return true;
  });

  if (fireworks.length > 0) {
    requestAnimationFrame(fwAnimate);
  } else {
    fwAnimating = false;
    fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
  }
}

/* ----- Floating emoji ----- */
function spawnFloatingEmoji(emoji) {
  const card = document.getElementById('qCard');
  if (!card) return;
  const rect = card.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'floating-emoji';
  el.textContent = emoji;
  el.style.left = (rect.left + rect.width / 2) + 'px';
  el.style.top = (rect.top + rect.height / 2) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

/* ----- Points burst ----- */
function spawnPointsBurst(x, y, text) {
  const el = document.createElement('div');
  el.className = 'points-burst';
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1400);
}

/* ----- Streak banner ----- */
function spawnStreakBanner(streak) {
  const messages = {
    3: '🔥 3 in a row!',
    4: '🔥 4 in a row!',
    5: '🔥🔥 5-streak — On fire!',
    6: '🔥🔥 6-streak!',
    7: '🔥🔥🔥 7-streak — Unstoppable!',
    8: '🔥🔥🔥 8-streak!',
    9: '🔥🔥🔥 9-streak!',
    10: '🔥🔥🔥 10-streak — LEGENDARY!'
  };
  const msg = messages[streak] || `🔥🔥🔥 ${streak}-streak — INCREDIBLE!`;
  const el = document.createElement('div');
  el.className = 'streak-banner';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1700);
}
